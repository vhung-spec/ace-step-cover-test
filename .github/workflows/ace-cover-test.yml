# Real ACE-Step 1.5 covers on a GitHub machine (no GPU): installs ACE-Step at
# a pinned commit, writes a public-domain source, covers it once per entry of
# the plan (plan.json, or the "plan" input) and scores every cover
# (score_covers.py). Start it by hand: Actions > ACE-Step cover test > Run
# workflow. Results: the run's summary and its "ace-cover-test" artifact.
name: ACE-Step cover test
run-name: 'Covers: ${{ inputs.model }}, ${{ inputs.song }} ${{ inputs.arrangement }} (${{ inputs.soundfont }})'

on:
  workflow_dispatch:
    inputs:
      plan:
        description: 'Test plan as JSON (empty: plan.json)'
        required: false
        default: ''
      model:
        description: 'ACE-Step model: turbo (the app''s), sft (slower, finer), base (lego and complete); xl: the 4B versions'
        type: choice
        options: [acestep-v15-turbo, acestep-v15-sft, acestep-v15-base,
                  acestep-v15-xl-turbo, acestep-v15-xl-sft, acestep-v15-xl-base]
        default: acestep-v15-turbo
      arrangement:
        description: 'Source arrangement: v2 (played like a person), v3 (v2 without pedal and low doublings) or v1 (plain)'
        type: choice
        options: [v2, v3, v1]
        default: v2
      soundfont:
        description: 'Instrument sounds for the source'
        type: choice
        options: [GeneralUser-GS, FluidR3]
        default: GeneralUser-GS
      song:
        description: 'Carol (public domain): We Wish You a Merry Christmas, or Silent Night (plain arrangement v1 only)'
        type: choice
        options: [wish, silent-night]
        default: wish

permissions:
  contents: read

jobs:
  covers:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      ACE_COMMIT: ca1e85fe9430179831e6bc6be790c332190a3866
      GUGS_COMMIT: 684543d5e5efaef08d02be50dcda8d552478fa60  # GeneralUser GS v2.0.3
      PLAN: ${{ inputs.plan }}
      MODEL: ${{ inputs.model }}
      ARRANGEMENT: ${{ inputs.arrangement }}
      SOUNDFONT: ${{ inputs.soundfont }}
      SONG: ${{ inputs.song }}
      # ACE-Step stops a take after 10 minutes; on CPU, 50 steps with guidance
      # (SFT, base) take longer than that.
      ACESTEP_GENERATION_TIMEOUT: '5400'
    steps:
      - uses: actions/checkout@v4

      - name: Room for ACE-Step (disk and swap)
        run: |
          echo "CPU: $(nproc) x$(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2)"
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h / /mnt
          # Everything big goes on the disk with the most room.
          root_free=$(df --output=avail -BG / | tail -1 | tr -dc 0-9)
          mnt_free=$(df --output=avail -BG /mnt | tail -1 | tr -dc 0-9)
          if [ "$mnt_free" -gt "$root_free" ]; then work=/mnt/work; else work=$HOME/work; fi
          sudo mkdir -p "$work" && sudo chown "$USER" "$work"
          sudo swapoff -a
          # An XL model (4B, float32 on CPU) needs about 20 GB beside the rest;
          # about 45 GB of the disk stays free for the models and tools.
          case "$MODEL" in *xl*) swap=28;; *) swap=16;; esac
          free=$(df --output=avail -BG "$work" | tail -1 | tr -dc 0-9)
          if [ $((free - 45)) -lt "$swap" ]; then swap=$((free - 45 > 8 ? free - 45 : 8)); fi
          echo "Swap: ${swap} GB"
          sudo fallocate -l "${swap}G" "$work/swap"
          sudo chmod 600 "$work/swap" && sudo mkswap "$work/swap" && sudo swapon "$work/swap"
          {
            echo "WORK=$work"
            echo "ACE_DIR=$work/ACE-Step-1.5"
            echo "ACE_VENV=$work/venv-ace"
            echo "ACESTEP_CHECKPOINTS_DIR=$work/checkpoints"
            echo "ACESTEP_PROJECT_ROOT=$work/ACE-Step-1.5"
            echo "UV_CACHE_DIR=$work/uv-cache"
            echo "UV_LINK_MODE=copy"
            echo "HF_HOME=$work/hf"
          } >> "$GITHUB_ENV"
          free -h

      - name: System tools
        timeout-minutes: 20
        run: |
          # The package mirror is sometimes slow (150 kB/s): only FluidSynth comes
          # from it, plus the 130 MB FluidR3 soundfont when that one is chosen;
          # ffmpeg comes from PyPI below. Each try has its own time limit.
          pkgs=fluidsynth
          if [ "$SOUNDFONT" = FluidR3 ]; then pkgs="$pkgs fluid-soundfont-gm"; fi
          apt_opts="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o DPkg::Lock::Timeout=120"
          for try in 1 2 3; do
            if timeout 240 sudo apt-get $apt_opts update -q &&
               timeout 480 sudo apt-get $apt_opts install -y -q --no-install-recommends $pkgs; then
              break
            fi
            echo "Package install, try $try failed"
            [ "$try" = 3 ] && exit 1
            sleep 15
          done

      - uses: astral-sh/setup-uv@v6

      - name: ffmpeg (static build from PyPI)
        run: |
          uv venv -q "$WORK/venv-tools"
          uv pip install -q --python "$WORK/venv-tools/bin/python" imageio-ffmpeg
          sudo ln -sf "$("$WORK/venv-tools/bin/python" -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')" \
            /usr/local/bin/ffmpeg
          ffmpeg -hide_banner -version | head -1

      - name: Install ACE-Step
        run: |
          git clone -q https://github.com/ACE-Step/ACE-Step-1.5.git "$ACE_DIR"
          git -C "$ACE_DIR" checkout -q "$ACE_COMMIT"
          (cd "$ACE_DIR" && UV_PROJECT_ENVIRONMENT="$ACE_VENV" uv sync --frozen --python 3.12)
          uv pip install -q --python "$ACE_VENV/bin/python" librosa mido
          # The judge's own code; its torch and other needs are already there.
          uv pip install -q --no-deps --python "$ACE_VENV/bin/python" audiobox_aesthetics
          uv cache clean
          "$ACE_VENV/bin/python" -c "import torch, acestep.inference, acestep.handler; print('torch', torch.__version__)"
          df -h "$WORK"

      - name: Download the models
        run: |
          "$ACE_VENV/bin/acestep-download" --dir "$ACESTEP_CHECKPOINTS_DIR"
          if [ "$MODEL" != acestep-v15-turbo ]; then
            "$ACE_VENV/bin/acestep-download" --model "$MODEL" --dir "$ACESTEP_CHECKPOINTS_DIR"
          fi
          du -sh "$ACESTEP_CHECKPOINTS_DIR"/*
          df -h "$WORK"

      - name: Source (public-domain carol)
        run: |
          soundfont=/usr/share/sounds/sf2/FluidR3_GM.sf2
          if [ "$SOUNDFONT" = GeneralUser-GS ]; then
            # Only the soundfont file, at a pinned commit of its author's repository.
            git clone -q --filter=blob:none --no-checkout https://github.com/mrbumpy409/GeneralUser-GS.git "$WORK/gugs"
            git -C "$WORK/gugs" checkout -q "$GUGS_COMMIT" -- GeneralUser-GS.sf2
            soundfont="$WORK/gugs/GeneralUser-GS.sf2"
          fi
          "$ACE_VENV/bin/python" make_source.py out/source --arrangement "$ARRANGEMENT" --soundfont "$soundfont" \
            --song "$SONG"

      - name: Covers
        timeout-minutes: 120
        run: |
          cd "$ACE_DIR"
          "$ACE_VENV/bin/python" "$GITHUB_WORKSPACE/cover.py" \
            --source "$GITHUB_WORKSPACE/out/source/source.wav" --out "$GITHUB_WORKSPACE/out" \
            --model "$MODEL" --plan "$PLAN"

      - name: Scores
        if: always()
        run: |
          "$ACE_VENV/bin/python" score_covers.py out
          if [ -f out/report.md ]; then cat out/report.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ace-cover-test
          path: |
            out/**/*.mp3
            out/**/*.png
            out/**/*.md
            out/**/*.json
            out/**/*.mid
          retention-days: 30
