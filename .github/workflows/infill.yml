# Parts written by an open-source model, Composer's Assistant 2 (M. Malandro,
# MIT; trained only on public-domain and permissively licensed MIDI), into
# one of our arrangements: infill.py follows a plan (versions/<song>/ai/
# <name>.plan.json) and writes takes of the parts. The model's code and
# weights come from its v2.1.0 release, checked against the checksum below,
# and run in a job that may only read this repository; a second job keeps
# the takes on the "ai" branch (replaced each run), whence a take is copied
# into versions/ and laid into a version (Style.written).
name: AI parts (Composer's Assistant 2)
run-name: "AI parts: ${{ inputs.plan }}"

on:
  workflow_dispatch:
    inputs:
      plan:
        description: 'Plans under versions/, without .plan.json, one or several (jingle-bells/ai/strings)'
        default: 'jingle-bells/ai/strings'

permissions:
  contents: read

env:
  CA2_URL: https://github.com/m-malandro/composers-assistant-REAPER/releases/download/v2.1.0/composers.assistant.v.2.1.0.zip
  CA2_SHA256: 2a17d0b12f17a5fc85f8d54c441e9a2d68b53e828115083942709aa676fac0b0

jobs:
  write:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: PyTorch (CPU) and Transformers
        run: |
          pip install -q --index-url https://download.pytorch.org/whl/cpu torch==2.4.1
          pip install -q transformers==4.44.2 mido==1.3.3

      - name: The model's release, cached
        id: cache
        uses: actions/cache@v4
        with:
          path: ca2.zip
          key: ca2-${{ env.CA2_SHA256 }}

      - name: Fetch the model's release
        if: steps.cache.outputs.cache-hit != 'true'
        run: curl -sSL -o ca2.zip "$CA2_URL"

      - name: Check and unpack it
        run: |
          echo "$CA2_SHA256  ca2.zip" | sha256sum -c
          mkdir -p "$RUNNER_TEMP/ca2"
          unzip -q ca2.zip 'Scripts/composers_assistant_v2/*' -d "$RUNNER_TEMP/ca2"

      - name: Write the parts
        env:
          PLANS: ${{ inputs.plan }}
        run: |
          for plan in $PLANS; do
            python infill.py "$plan" takes --ca2 "$RUNNER_TEMP/ca2/Scripts/composers_assistant_v2"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: takes
          path: takes
          retention-days: 30

  keep:
    needs: write
    runs-on: ubuntu-24.04
    permissions:
      contents: write  # the ai branch
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: takes
          path: takes

      - name: The takes on the ai branch
        env:
          PLAN: ${{ inputs.plan }}
        run: |
          cd takes
          git init -q -b ai
          git add ./*.json
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Takes of $PLAN by Composer's Assistant 2 (run $GITHUB_RUN_ID)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/$GITHUB_REPOSITORY" ai
