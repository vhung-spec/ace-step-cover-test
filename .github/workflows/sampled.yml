# The carols arranged for real instrument samples, with no AI model making
# any sound: arrange.py writes one MIDI file per instrument, fetch_samples.py
# fetches the CC0 instruments it uses, render_samples.py plays them with
# sfizz and mixes them (balance, stereo, hall reverb, loudness), and rate.py
# rates the pieces. Each carol is played by a job of its own, side by side.
# Every mix is mastered toward two reference recordings (master.py).
# Results: an artifact per carol ("sampled-<carol>": MP3, MIDI, ratings), all
# of them together ("sampled"), and pairs of pieces before and after their
# master ("so-sanh-master"); smaller MP3s of every piece are pushed to the
# "renders" branch (replaced each run), for analysis where artifacts cannot
# be downloaded.
name: Real-sample arrangements
run-name: 'Sampled: ${{ inputs.songs }} / ${{ inputs.styles }}'

on:
  workflow_dispatch:
    inputs:
      songs:
        description: 'Carols: wish (We Wish You a Merry Christmas), silent-night, first-noel, joy (Joy to the World), o-holy-night, jingle-bells, deck-the-halls'
        default: 'wish silent-night first-noel joy o-holy-night jingle-bells deck-the-halls'
      styles:
        description: 'Styles: piano (Steinway B); gentle pianos: chill, lullaby, flowing, hymn, piano-strings, felt, felt-noise; ballad, pulse (free intro, high tune); bells; orchestra; salamander (piano on the Salamander Grand Piano)'
        default: 'piano chill lullaby flowing hymn piano-strings felt felt-noise ballad pulse bells orchestra'
      rate:
        description: 'Rate the pieces (Audiobox Aesthetics, CLAP)'
        type: boolean
        default: true

permissions:
  contents: write  # the renders branch

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      songs: ${{ steps.list.outputs.songs }}
    steps:
      - id: list
        env:
          SONGS: ${{ inputs.songs }}
        run: echo "songs=$(python3 -c 'import json, sys; print(json.dumps(sys.argv[1:]))' $SONGS)" >> "$GITHUB_OUTPUT"

  sampled:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        song: ${{ fromJSON(needs.plan.outputs.songs) }}
    env:
      SONG: ${{ matrix.song }}
      STYLES: ${{ inputs.styles }}
      SFIZZ_VERSION: '1.2.3'
      PYTHONUNBUFFERED: '1'  # the log shows each part as it is played
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Python tools and ffmpeg
        run: |
          uv venv -q --python 3.12 "$RUNNER_TEMP/venv"
          uv pip install -q --python "$RUNNER_TEMP/venv/bin/python" numpy scipy soundfile mido pyloudnorm imageio-ffmpeg
          sudo ln -sf "$("$RUNNER_TEMP/venv/bin/python" -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')" \
            /usr/local/bin/ffmpeg
          ffmpeg -hide_banner -encoders | grep -i mp3

      - name: sfizz from the cache
        id: sfizz
        uses: actions/cache@v4
        with:
          path: ~/sfizz
          key: sfizz-render-${{ env.SFIZZ_VERSION }}-ubuntu-24.04

      - name: Build sfizz_render
        if: steps.sfizz.outputs.cache-hit != 'true'
        run: |
          git clone -q --recursive --depth 1 --shallow-submodules --branch "$SFIZZ_VERSION" \
            https://github.com/sfztools/sfizz.git "$RUNNER_TEMP/sfizz"
          cmake -S "$RUNNER_TEMP/sfizz" -B "$RUNNER_TEMP/sfizz/build" -DCMAKE_BUILD_TYPE=Release -DENABLE_LTO=OFF \
            -DSFIZZ_JACK=OFF -DSFIZZ_RENDER=ON -DSFIZZ_SHARED=OFF -DSFIZZ_TESTS=OFF -DSFIZZ_DEMOS=OFF \
            -DSFIZZ_DEVTOOLS=OFF -DSFIZZ_BENCHMARKS=OFF
          cmake --build "$RUNNER_TEMP/sfizz/build" -j4 --target sfizz_render
          mkdir -p ~/sfizz
          find "$RUNNER_TEMP/sfizz/build" -name sfizz_render -type f -exec cp {} ~/sfizz/ \;
          ~/sfizz/sfizz_render --help | head -3

      - name: Arrangements (MIDI)
        run: '"$RUNNER_TEMP/venv/bin/python" arrange.py out/sampled --songs "$SONG" --styles $STYLES'

      - name: Instruments (CC0 samples)
        run: '"$RUNNER_TEMP/venv/bin/python" fetch_samples.py out/sampled "$RUNNER_TEMP/libs"'

      - name: Play and mix
        run: |
          "$RUNNER_TEMP/venv/bin/python" render_samples.py out/sampled --sfizz ~/sfizz/sfizz_render \
            --vsco "$RUNNER_TEMP/libs/vsco" --vcsl "$RUNNER_TEMP/libs/vcsl" --salamander "$RUNNER_TEMP/libs/salamander" \
            --premaster out/premaster

      - name: Smaller copies for the renders branch
        run: |
          mkdir -p out/preview
          for wav in out/sampled/*.wav; do
            ffmpeg -loglevel error -i "$wav" -c:a libmp3lame -b:a 128k "out/preview/$(basename "${wav%.wav}").mp3"
          done

      - name: Rate
        if: inputs.rate
        run: |
          uv pip install -q --python "$RUNNER_TEMP/venv/bin/python" torch torchaudio \
            --index-url https://download.pytorch.org/whl/cpu
          # transformers as pinned by ACE-Step: CLAP's API changed in 5.x
          uv pip install -q --python "$RUNNER_TEMP/venv/bin/python" librosa audiobox_aesthetics transformers==4.57.6
          "$RUNNER_TEMP/venv/bin/python" rate.py out/sampled | tee "out/sampled/rated-$SONG.txt"
          cp "out/sampled/rated-$SONG.txt" out/preview/
          { echo "### $SONG rated"; sed -n '/^| piece/,$p' "out/sampled/rated-$SONG.txt"; } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the pieces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sampled-${{ matrix.song }}
          path: |
            out/sampled/*.mp3
            out/sampled/**/*.mid
            out/sampled/**/mix.json
            out/sampled/rated-*.txt
          retention-days: 30

      - name: Keep the smaller copies
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-${{ matrix.song }}
          path: out/preview
          retention-days: 1

      - name: Keep the pieces before their master
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: premaster-${{ matrix.song }}
          path: out/premaster
          retention-days: 3

  collect:
    needs: sampled
    if: always()
    runs-on: ubuntu-24.04
    env:
      SONGS: ${{ inputs.songs }}
      STYLES: ${{ inputs.styles }}
    steps:
      - name: Every carol's pieces
        uses: actions/download-artifact@v4
        with:
          pattern: sampled-*
          path: all
          merge-multiple: true

      - name: All the pieces in one artifact
        uses: actions/upload-artifact@v4
        with:
          name: sampled
          path: all
          retention-days: 30

      - name: Every carol's pieces before their master
        uses: actions/download-artifact@v4
        with:
          pattern: premaster-*
          path: premaster
          merge-multiple: true

      - name: Before and after the master, side by side
        run: |
          mkdir -p compare
          for piece in wish-ballad silent-night-ballad first-noel-ballad joy-ballad o-holy-night-ballad \
              jingle-bells-ballad deck-the-halls-ballad wish-chill silent-night-piano silent-night-pulse \
              wish-orchestra silent-night-bells; do
            if [ -f "premaster/$piece.mp3" ] && [ -f "all/$piece.mp3" ]; then
              cp "premaster/$piece.mp3" "compare/$piece - 1 truoc master.mp3"
              cp "all/$piece.mp3" "compare/$piece - 2 sau master.mp3"
            fi
          done
          ls compare

      - name: The pairs in one artifact
        uses: actions/upload-artifact@v4
        with:
          name: so-sanh-master
          path: compare
          retention-days: 30

      - name: The smaller copies
        uses: actions/download-artifact@v4
        with:
          pattern: preview-*
          path: preview
          merge-multiple: true

      - name: Pieces on the renders branch
        run: |
          cd preview
          cat rated-*.txt > rated.txt 2>/dev/null || true
          git init -q -b renders
          git add ./*.mp3 && git add rated.txt 2>/dev/null || true
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Renders of run $GITHUB_RUN_ID ($SONGS / $STYLES), 128 kbit/s"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/$GITHUB_REPOSITORY" renders
