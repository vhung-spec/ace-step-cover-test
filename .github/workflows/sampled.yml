# The carols arranged for real instrument samples, with no AI model making
# any sound: arrange.py writes one MIDI file per instrument, fetch_samples.py
# fetches the CC0 instruments it uses, render_samples.py plays them with
# sfizz and mixes them (balance, stereo, hall reverb, loudness), and rate.py
# rates the pieces. Each carol is played by a job of its own, side by side.
# Results: an artifact per carol ("sampled-<carol>": MP3, MIDI, ratings) and
# all of them together ("sampled"); smaller MP3s of every piece are pushed to
# the "renders" branch (replaced each run), for analysis where artifacts
# cannot be downloaded.
name: Real-sample arrangements
run-name: >-
  Sampled: ${{ inputs.versions != '' && inputs.versions
  || format('{0} / {1} / {2}', inputs.songs, inputs.styles, inputs.pianos) }}

on:
  workflow_dispatch:
    inputs:
      songs:
        description: 'Carols: wish (We Wish You a Merry Christmas), silent-night, first-noel, joy (Joy to the World), o-holy-night, jingle-bells, deck-the-halls'
        default: 'wish silent-night first-noel joy o-holy-night jingle-bells deck-the-halls'
      styles:
        description: 'Styles: ballad (after the second reference recording, on a Rhodes), pulse (after the first, on the Yamaha upright), both in a small, close room; ballad-plain (the Rhodes without its chorus); pulse-near (a 1.2 s room), pulse-hall, pulse-hall-plain (the 2.8 s hall; plain: no glockenspiel); ballad-clear, pulse-clear (on the Steinway grand in the old 2.8 s hall, note by note and brighter); the earlier ones: piano (Steinway B), the gentle pianos chill, lullaby, flowing, hymn, piano-strings, felt, felt-noise (Yamaha upright), bells, orchestra, salamander; the church styles church-organ, church-organ-plain (the carol''s own chords), church-choir, church-festive, chapel (an organ and a choir, the hymn harmony of chorale.py), and each closer by with -near (a small 0.8 s room); close by and easier to listen to: church-piano-near (the hymn on the Yamaha upright), church-organ-clear-near (the organ, its tune clear), church-organ-ensemble-near (that organ with a harp, a choir humming, violas and a flute), church-organ-hum-near (the same, the humming voices forward), church-organ-soft-near and church-organ-small-near (church-organ-ensemble-near on softer organs, the quiet manual''s flute or the small Renaissance organ); played as a person plays them: felt-4k-human, church-organ-soft-human-near, pulse-human, ballad-human, orchestra-gentle-human, church-piano-human-near, church-organ-small-human-near (the accompaniment breathing with each phrase, the tempo and the tune shaped over it); simulated instruments (sfizz''s own oscillators, no recording): church-organ-synth-human-near, ballad-synth-human, felt-synth-human; made for a song''s version: felt-ensemble-human (felt-4k-human on a soft bed of strings, bells now and then, the last verse an octave up); felt-pad-human, felt-hum-human, felt-strings-human (no bells, over a warm pad, humming voices or light high strings), felt-choir-human (over a choir singing softly), felt-carol-human (a carol''s choir in a far hall behind it)'
        default: 'ballad pulse'
      pianos:
        description: 'To compare, play the piano styles on these instead of their own, a piece each: grand (Steinway B, highs open), piano (Steinway B, highs cut), knight (Knight upright), yamaha (Yamaha upright). ep (the Rhodes). Empty: each its own (ballad the Rhodes, pulse and the gentle styles the Yamaha upright, ballad-clear and pulse-clear the grand, piano the Steinway)'
        default: ''
      versions:
        description: 'Versions of a song made one at a time with the user, played instead of songs and styles: files in versions/, named without versions/ and .json (jingle-bells/piano-ni-v1). Each also gets a lossless FLAC on the renders branch'
        default: ''
      rate:
        description: 'Rate the pieces (Audiobox Aesthetics, CLAP)'
        type: boolean
        default: true

permissions:
  contents: write  # the renders branch

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      songs: ${{ steps.list.outputs.songs }}
    steps:
      - id: list
        env:
          SONGS: ${{ inputs.songs }}
          VERSIONS: ${{ inputs.versions }}
        run: |
          # a version's song is the folder it is in (versions/<song>/)
          [ -n "$VERSIONS" ] && SONGS=$(for v in $VERSIONS; do echo "${v%%/*}"; done | sort -u)
          echo "songs=$(python3 -c 'import json, sys; print(json.dumps(sys.argv[1:]))' $SONGS)" >> "$GITHUB_OUTPUT"

  sampled:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        song: ${{ fromJSON(needs.plan.outputs.songs) }}
    env:
      SONG: ${{ matrix.song }}
      STYLES: ${{ inputs.styles }}
      PIANOS: ${{ inputs.pianos }}
      VERSIONS: ${{ inputs.versions }}
      SFIZZ_VERSION: '1.2.3'
      PYTHONUNBUFFERED: '1'  # the log shows each part as it is played
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Python tools and ffmpeg
        run: |
          uv venv -q --python 3.12 "$RUNNER_TEMP/venv"
          uv pip install -q --python "$RUNNER_TEMP/venv/bin/python" numpy scipy soundfile mido pyloudnorm imageio-ffmpeg
          sudo ln -sf "$("$RUNNER_TEMP/venv/bin/python" -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')" \
            /usr/local/bin/ffmpeg
          ffmpeg -hide_banner -encoders | grep -i mp3

      - name: FluidSynth (the church styles' choir and bell tower, from GeneralUser GS)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends fluidsynth
          fluidsynth --version | head -1

      - name: sfizz from the cache
        id: sfizz
        uses: actions/cache@v4
        with:
          path: ~/sfizz
          key: sfizz-render-${{ env.SFIZZ_VERSION }}-ubuntu-24.04

      - name: Build sfizz_render
        if: steps.sfizz.outputs.cache-hit != 'true'
        run: |
          git clone -q --recursive --depth 1 --shallow-submodules --branch "$SFIZZ_VERSION" \
            https://github.com/sfztools/sfizz.git "$RUNNER_TEMP/sfizz"
          cmake -S "$RUNNER_TEMP/sfizz" -B "$RUNNER_TEMP/sfizz/build" -DCMAKE_BUILD_TYPE=Release -DENABLE_LTO=OFF \
            -DSFIZZ_JACK=OFF -DSFIZZ_RENDER=ON -DSFIZZ_SHARED=OFF -DSFIZZ_TESTS=OFF -DSFIZZ_DEMOS=OFF \
            -DSFIZZ_DEVTOOLS=OFF -DSFIZZ_BENCHMARKS=OFF
          cmake --build "$RUNNER_TEMP/sfizz/build" -j4 --target sfizz_render
          mkdir -p ~/sfizz
          find "$RUNNER_TEMP/sfizz/build" -name sfizz_render -type f -exec cp {} ~/sfizz/ \;
          ~/sfizz/sfizz_render --help | head -3

      - name: Arrangements (MIDI)
        run: |
          if [ -n "$VERSIONS" ]; then
            "$RUNNER_TEMP/venv/bin/python" arrange.py out/sampled --versions $(for v in $VERSIONS; do
              [ "${v%%/*}" = "$SONG" ] && echo "$v"; done)
          else
            "$RUNNER_TEMP/venv/bin/python" arrange.py out/sampled --songs "$SONG" --styles $STYLES ${PIANOS:+--pianos $PIANOS}
          fi

      - name: Instruments (CC0 samples)
        run: '"$RUNNER_TEMP/venv/bin/python" fetch_samples.py out/sampled "$RUNNER_TEMP/libs"'

      - name: Play and mix
        run: |
          "$RUNNER_TEMP/venv/bin/python" render_samples.py out/sampled --sfizz ~/sfizz/sfizz_render \
            --vsco "$RUNNER_TEMP/libs/vsco" --vcsl "$RUNNER_TEMP/libs/vcsl" --salamander "$RUNNER_TEMP/libs/salamander" \
            --jrhodes "$RUNNER_TEMP/libs/jrhodes" --generaluser "$RUNNER_TEMP/libs/generaluser"

      - name: Smaller copies for the renders branch
        run: |
          mkdir -p out/preview
          for wav in out/sampled/*.wav; do
            ffmpeg -loglevel error -i "$wav" -c:a libmp3lame -b:a 128k "out/preview/$(basename "${wav%.wav}").mp3"
            # a version is heard and measured as it is, without the MP3's loss
            [ -z "$VERSIONS" ] || ffmpeg -loglevel error -i "$wav" -c:a flac -sample_fmt s16 \
              "out/preview/$(basename "${wav%.wav}").flac"
          done

      - name: Rate
        if: inputs.rate
        run: |
          uv pip install -q --python "$RUNNER_TEMP/venv/bin/python" torch torchaudio \
            --index-url https://download.pytorch.org/whl/cpu
          # transformers as pinned by ACE-Step: CLAP's API changed in 5.x
          uv pip install -q --python "$RUNNER_TEMP/venv/bin/python" librosa audiobox_aesthetics transformers==4.57.6
          "$RUNNER_TEMP/venv/bin/python" rate.py out/sampled | tee "out/sampled/rated-$SONG.txt"
          cp "out/sampled/rated-$SONG.txt" out/preview/
          { echo "### $SONG rated"; sed -n '/^| piece/,$p' "out/sampled/rated-$SONG.txt"; } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the pieces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sampled-${{ matrix.song }}
          path: |
            out/sampled/*.mp3
            out/sampled/**/*.mid
            out/sampled/**/mix.json
            out/sampled/rated-*.txt
          retention-days: 30

      - name: Keep the smaller copies
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-${{ matrix.song }}
          path: out/preview
          retention-days: 1

  collect:
    needs: sampled
    if: always()
    runs-on: ubuntu-24.04
    env:
      SONGS: ${{ inputs.songs }}
      STYLES: ${{ inputs.styles }}
      VERSIONS: ${{ inputs.versions }}
    steps:
      - name: Every carol's pieces
        uses: actions/download-artifact@v4
        with:
          pattern: sampled-*
          path: all
          merge-multiple: true

      - name: All the pieces in one artifact
        uses: actions/upload-artifact@v4
        with:
          name: sampled
          path: all
          retention-days: 30

      - name: The smaller copies
        uses: actions/download-artifact@v4
        with:
          pattern: preview-*
          path: preview
          merge-multiple: true

      - name: Pieces on the renders branch
        run: |
          cd preview
          cat rated-*.txt > rated.txt 2>/dev/null || true
          git init -q -b renders
          git add ./*.mp3 && git add rated.txt 2>/dev/null || true
          git add ./*.flac 2>/dev/null || true
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Renders of run $GITHUB_RUN_ID (${VERSIONS:-$SONGS / $STYLES}), 128 kbit/s${VERSIONS:+ and FLAC}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/$GITHUB_REPOSITORY" renders
